name: publish-npm

on:
  workflow_dispatch:
  push:
    tags:
      - "npm-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-bundle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Show package
        run: npm pkg get name version

      - name: Publish with provenance
        run: npm publish --access public --provenance
