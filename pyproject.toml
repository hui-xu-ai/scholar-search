[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scholar-search"
version = "0.3.0"
description = "学术检索：只读的学术题录检索微内核，渠道可插拔（知网为首个渠道）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "scholar-search contributors" }]
keywords = ["mcp", "scholarly", "search", "retrieval", "metadata", "literature", "cnki"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "mcp>=1.20,<2",
  "packaging>=24",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.12", "mypy>=1.11", "pre-commit>=3.7"]

[project.scripts]
scholar-search = "scholar_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_search"]

# Browser-side assets travel inside the wheel so a package-only install can
# still complete the documented native-host and extension setup.
[tool.hatch.build.targets.wheel.force-include]
"native-host/main.py" = "scholar_search/assets/native-host/main.py"
"native-host/launcher.cs" = "scholar_search/assets/native-host/launcher.cs"
"native-host/install.ps1" = "scholar_search/assets/native-host/install.ps1"
"native-host/README.md" = "scholar_search/assets/native-host/README.md"
"extension/manifest.json" = "scholar_search/assets/extension/manifest.json"
"extension/background.js" = "scholar_search/assets/extension/background.js"
"extension/content/actions.js" = "scholar_search/assets/extension/content/actions.js"
"schemas/record.json" = "scholar_search/assets/schemas/record.json"
"schemas/tools.json" = "scholar_search/assets/schemas/tools.json"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "docs",
  "schemas",
  "native-host",
  "extension",
  "skills",
  "tests/fixtures",
  "README.md",
  "LICENSE",
  "NOTICE",
  "CHANGELOG.md",
  "AGENTS.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# UP017: we keep timezone.utc for readability across 3.11/3.12.
# SIM300: comparisons in this codebase read naturally with limits on the left.
# RUF001-003: Chinese punctuation in selectors and fixtures is intentional.
ignore = ["UP017", "SIM300", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["scholar_search", "support"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: live browser tests, opt-in only"]








