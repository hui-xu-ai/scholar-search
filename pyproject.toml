[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scholar-search"
version = "0.1.0"
description = "学术检索：只读的学术题录检索微内核，渠道可插拔（知网为首个渠道）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "scholar-search contributors" }]
keywords = ["mcp", "scholarly", "search", "retrieval", "metadata", "literature", "cnki"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = ["mcp>=1.20,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.12", "mypy>=1.11", "pre-commit>=3.7"]

[project.scripts]
scholar-search = "scholar_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_search"]

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "schemas", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: live browser tests, opt-in only"]
